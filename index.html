<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetView — warehouse robot fleet planner</title>
    <meta
      name="description"
      content="Draw a warehouse floor, place a robot fleet, and simulate throughput, congestion and payback in the browser."
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">FleetView</span>
          <span class="brand__sub">fleet planner</span>
        </div>
        <label class="field field--inline">
          <span class="field__label">Layout</span>
          <select id="preset" class="control"></select>
        </label>
        <div class="topbar__actions">
          <button id="import-json" class="btn" type="button">Import JSON</button>
          <button id="export-json" class="btn" type="button">Export JSON</button>
          <button id="import-png" class="btn" type="button">Trace a PNG</button>
        </div>
        <input id="file-json" type="file" accept="application/json,.json" hidden />
        <input id="file-png" type="file" accept="image/png,image/jpeg" hidden />
      </header>

      <div class="body">
        <nav class="tools" aria-label="Floor plan tools">
          <p class="tools__title">Draw</p>
          <div class="tools__grid" id="tool-list" role="radiogroup" aria-label="Cell tool"></div>

          <p class="tools__title">Floor</p>
          <div class="tools__row">
            <label class="field">
              <span class="field__label">Width</span>
              <input id="grid-w" class="control" type="number" min="4" max="200" value="40" />
            </label>
            <label class="field">
              <span class="field__label">Height</span>
              <input id="grid-h" class="control" type="number" min="4" max="200" value="24" />
            </label>
          </div>
          <button id="resize" class="btn btn--wide" type="button">Resize floor</button>
          <button id="clear" class="btn btn--wide" type="button">Clear floor</button>

          <p class="tools__title">Backdrop</p>
          <label class="field">
            <span class="field__label">Opacity <output id="backdrop-out">0.5</output></span>
            <input id="backdrop" class="control" type="range" min="0" max="1" step="0.05" value="0.5" />
          </label>
          <button id="backdrop-clear" class="btn btn--wide" type="button">Remove backdrop</button>

          <label class="check">
            <input id="show-heat" type="checkbox" />
            <span>Congestion overlay</span>
          </label>
        </nav>

        <main class="stage">
          <canvas id="floor" class="stage__canvas"></canvas>
          <div class="stage__hud">
            <span id="hud-cell">—</span>
            <span id="hud-robots">0 robots</span>
          </div>
        </main>

        <aside class="panels" aria-label="Simulation settings and results">
          <section class="panel">
            <h2 class="panel__title">Fleet</h2>
            <div class="grid2">
              <label class="field"><span class="field__label">Robots</span>
                <input id="f-count" class="control" type="number" min="0" max="400" value="12" /></label>
              <label class="field"><span class="field__label">Ticks / cell</span>
                <input id="f-move" class="control" type="number" min="1" max="20" value="1" /></label>
              <label class="field"><span class="field__label">Turn cost</span>
                <input id="f-turn" class="control" type="number" min="0" max="20" value="1" /></label>
              <label class="field"><span class="field__label">Payload</span>
                <input id="f-payload" class="control" type="number" min="1" max="20" value="1" /></label>
              <label class="field"><span class="field__label">Battery</span>
                <input id="f-battery" class="control" type="number" min="10" max="100000" value="1800" /></label>
              <label class="field"><span class="field__label">Charge rate</span>
                <input id="f-charge" class="control" type="number" min="1" max="500" value="20" /></label>
              <label class="field"><span class="field__label">Charge below</span>
                <input id="f-thresh" class="control" type="number" min="0" max="0.9" step="0.05" value="0.2" /></label>
            </div>
          </section>

          <section class="panel">
            <h2 class="panel__title">Run</h2>
            <div class="grid2">
              <label class="field"><span class="field__label">Seed</span>
                <input id="c-seed" class="control" type="number" min="1" value="1" /></label>
              <label class="field"><span class="field__label">Ticks</span>
                <input id="c-ticks" class="control" type="number" min="10" max="200000" value="3000" /></label>
              <label class="field"><span class="field__label">Arrivals</span>
                <select id="c-mode" class="control">
                  <option value="poisson">Poisson</option>
                  <option value="fixed">Fixed interval</option>
                </select></label>
              <label class="field"><span class="field__label">Orders / tick</span>
                <input id="c-rate" class="control" type="number" min="0.01" max="20" step="0.01" value="0.05" /></label>
              <label class="field"><span class="field__label">Order cap</span>
                <input id="c-count" class="control" type="number" min="0" max="100000" value="0" /></label>
              <label class="field"><span class="field__label">Seconds / tick</span>
                <input id="c-secs" class="control" type="number" min="0.1" max="60" step="0.1" value="1" /></label>
            </div>
            <button id="run" class="btn btn--primary btn--wide" type="button">Run simulation</button>
            <p id="run-status" class="status" role="status">Idle</p>
          </section>

          <section class="panel">
            <h2 class="panel__title">Results</h2>
            <dl class="metrics" id="metrics">
              <div class="metric"><dt>Orders / hour</dt><dd id="m-oph">—</dd></div>
              <div class="metric"><dt>Utilisation</dt><dd id="m-util">—</dd></div>
              <div class="metric"><dt>Latency mean</dt><dd id="m-lat">—</dd></div>
              <div class="metric"><dt>Latency p95</dt><dd id="m-p95">—</dd></div>
              <div class="metric"><dt>Completed</dt><dd id="m-done">—</dd></div>
              <div class="metric"><dt>Accepted</dt><dd id="m-acc">—</dd></div>
            </dl>
          </section>

          <section class="panel">
            <h2 class="panel__title">Fleet size sweep</h2>
            <label class="field"><span class="field__label">Sizes to test</span>
              <input id="sweep-sizes" class="control" type="text" value="2, 4, 8, 12, 16, 24" /></label>
            <button id="sweep" class="btn btn--wide" type="button">Run sweep</button>
            <canvas id="curve" class="curve" width="320" height="160"></canvas>
            <p id="sweep-note" class="status">Saturation point appears here.</p>
          </section>

          <section class="panel">
            <h2 class="panel__title">Payback</h2>
            <div class="grid2">
              <label class="field"><span class="field__label">Cost / robot</span>
                <input id="r-hw" class="control" type="number" min="0" value="45000" /></label>
              <label class="field"><span class="field__label">Ops / robot / yr</span>
                <input id="r-ops" class="control" type="number" min="0" value="3500" /></label>
              <label class="field"><span class="field__label">Worker cost / yr</span>
                <input id="r-labor" class="control" type="number" min="0" value="52000" /></label>
              <label class="field"><span class="field__label">Workers displaced</span>
                <input id="r-workers" class="control" type="number" min="0" step="0.5" value="6" /></label>
              <label class="field"><span class="field__label">Horizon (yrs)</span>
                <input id="r-years" class="control" type="number" min="1" max="20" value="5" /></label>
            </div>
            <dl class="metrics">
              <div class="metric"><dt>Capex</dt><dd id="r-capex">—</dd></div>
              <div class="metric"><dt>Net saving / yr</dt><dd id="r-net">—</dd></div>
              <div class="metric"><dt>Payback</dt><dd id="r-payback">—</dd></div>
              <div class="metric"><dt>ROI at horizon</dt><dd id="r-roi">—</dd></div>
            </dl>
          </section>
        </aside>
      </div>

      <footer class="transport">
        <button id="play" class="btn btn--play" type="button" disabled>Play</button>
        <div class="rule">
          <input id="scrub" class="rule__input" type="range" min="0" max="0" value="0" disabled
                 aria-label="Playback position" />
          <div class="rule__ticks" id="rule-ticks" aria-hidden="true"></div>
        </div>
        <div class="transport__meta">
          <span id="tick-read" class="tick-read">0000</span>
          <div class="speeds" id="speeds" role="radiogroup" aria-label="Playback speed"></div>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
